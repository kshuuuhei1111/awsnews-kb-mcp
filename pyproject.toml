[tool.uv.workspace]
members = ["packages/ingestion/*", "packages/tools/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages/ingestion", "packages/tools"]
addopts = "--import-mode=importlib"
