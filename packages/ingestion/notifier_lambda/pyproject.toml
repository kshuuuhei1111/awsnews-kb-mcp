[project]
name = "notifier-lambda"
version = "0.1.0"
description = "SNS経由でCloudWatch Alarmの状態変化を受け取り、任意でSlack Incoming Webhookに転送するLambda"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "boto3>=1.35",
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notifier_lambda"]
