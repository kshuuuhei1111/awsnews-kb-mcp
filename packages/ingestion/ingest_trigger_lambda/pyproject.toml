[project]
name = "ingest-trigger-lambda"
version = "0.1.0"
description = "SQS経由でS3の新着記事イベントを受け取り、Bedrock KBのStartIngestionJobを呼ぶLambda"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "boto3>=1.35",
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest_trigger_lambda"]
