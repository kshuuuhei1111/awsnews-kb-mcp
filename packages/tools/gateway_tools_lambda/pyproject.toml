[project]
name = "gateway-tools-lambda"
version = "0.1.0"
description = "AgentCore GatewayのLambdaターゲット。search_aws_updates / get_article ツールを実装する"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "boto3>=1.35",
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway_tools_lambda"]
